<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 01 - Microservices Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 { color: #2c3e50; }
        section {
            border: 1px solid #dcdde1;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        button {
            background: #2980b9;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            cursor: pointer;
        }
        button:hover { background: #1f6391; }
        input {
            padding: 7px;
            border: 1px solid #bbb;
            border-radius: 4px;
            width: 200px;
        }
        ul { line-height: 1.8; }
        pre {
            background: #f4f6f7;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            padding: 12px;
            min-height: 24px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Lab 01 - Product &amp; Order Microservices</h1>

    <section>
        <h2>Danh sách sản phẩm</h2>
        <button onclick="loadProducts()">Tải danh sách sản phẩm</button>
        <ul id="productList">Chưa có dữ liệu.</ul>
    </section>

    <section>
        <h2>Tìm sản phẩm thông qua Order Service</h2>
        <input type="number" id="productId" placeholder="Nhập ID sản phẩm" min="1">
        <button onclick="findProduct()">Tìm sản phẩm</button>
        <pre id="result"></pre>
    </section>

    <script>
        async function loadProducts() {
            try {
                const response = await fetch(
                    "http://localhost:8081/api/products"
                );
                if (!response.ok) {
                    throw new Error("Không thể tải danh sách sản phẩm");
                }

                const products = await response.json();
                const list = document.getElementById("productList");
                list.innerHTML = "";
                if (products.length === 0) {
                    list.textContent = "Chưa có sản phẩm";
                    return;
                }

                products.forEach(product => {
                    const li = document.createElement("li");
                    li.textContent = `${product.id} - ${product.name}`;
                    list.appendChild(li);
                });
            } catch (error) {
                document.getElementById("productList").textContent =
                    "Lỗi: " + error.message;
            }
        }

        async function findProduct() {
            const id = document.getElementById("productId").value;
            const result = document.getElementById("result");

            if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {
                result.textContent = "Vui lòng nhập ID hợp lệ";
                return;
            }

            try {
                const response = await fetch(
                    `http://localhost:8082/api/orders/product/${id}`
                );

                if (response.status === 404) {
                    result.textContent = "Không tìm thấy sản phẩm";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Không thể lấy thông tin sản phẩm");
                }

                const product = await response.json();
                result.textContent = JSON.stringify(product, null, 2);
            } catch (error) {
                result.textContent = "Lỗi: " + error.message;
            }
        }
    </script>
</body>
</html>
